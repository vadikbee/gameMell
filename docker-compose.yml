#docker-compose.yml
services:
  nginx:
    image: nginx:alpine
    container_name: winnery.cucaracha-sprint-space-maze-mvp-game.nginx
    ports:
      - "127.0.0.1:8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: winnery.cucaracha-sprint-space-maze-mvp-game.backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    env_file:
      - ./backend/.env.production
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BUILD_ENV=production # Измените на "development" для dev режима
    container_name: winnery.cucaracha-sprint-space-maze-mvp-game.frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env.production
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge